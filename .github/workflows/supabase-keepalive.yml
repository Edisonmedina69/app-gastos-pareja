name: Supabase Keep-Alive Ping

on:
  schedule:
    # Cada 2 días a las 06:00 UTC
    - cron: '0 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-supabase:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Consultar la base de Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::Faltan los secrets VITE_SUPABASE_URL o VITE_SUPABASE_ANON_KEY"
            exit 1
          fi
          # Consulta real a una tabla (espacios). Si RLS devuelve 0 filas,
          # igual cuenta como actividad en la base.
          url="${SUPABASE_URL%/}/rest/v1/espacios?select=id&limit=1"
          status=$(curl -sS -o response.json -w '%{http_code}' \
            --retry 3 --retry-delay 10 --retry-all-errors --max-time 30 \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "$url") || status="000"
          echo "HTTP ${status}"
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "::error::Supabase respondió HTTP ${status}"
            head -c 500 response.json 2>/dev/null || true
            echo
            exit 1
          fi
          echo "Consulta OK. Filas devueltas: $(jq 'length' response.json)"

  # GitHub desactiva los workflows programados tras 60 días sin actividad en
  # el repo. Re-habilitar el workflow por API reinicia ese contador sin hacer
  # commits (equivalente al "API mode" de keepalive-workflow).
  keepalive-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Mantener el workflow habilitado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable"
          echo "Workflow re-habilitado; contador de inactividad reiniciado."
